<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wild Runner - เกมวิ่งผจญภัย</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
}
#wrap { position: relative; }
canvas {
    display: block;
    border: 2px solid #00cc66;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,204,102,0.25);
}
#hint {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    color: #556;
    font-size: 12px;
    white-space: nowrap;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="520"></canvas>
  <div id="hint">↑/Space: กระโดด &nbsp;|&nbsp; Fox: X = Dash &nbsp;|&nbsp; Tiger: กระโดดทับศัตรู &nbsp;|&nbsp; Rabbit: กระโดด 2 ครั้ง</div>
</div>
<script>
// ─── Canvas setup ─────────────────────────────────────────────────────────────
const c  = document.getElementById('c');
const cx = c.getContext('2d');
const W  = c.width;
const H  = c.height;

// ─── State machine ────────────────────────────────────────────────────────────
const S = { MENU: 0, SELECT: 1, PLAY: 2, OVER: 3, WIN: 4 };
let state = S.MENU;

// ─── Input ────────────────────────────────────────────────────────────────────
const K = {};
document.addEventListener('keydown', e => {
    if (!K[e.code]) { K[e.code] = true; onKey(e.code); }
    if (!['F5','F12'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { K[e.code] = false; });

// ─── Character definitions ────────────────────────────────────────────────────
const CHARS = {
    fox: {
        id: 'fox', name: 'สุนัขจิ้งจอก', emoji: '🦊',
        speed: 8, jump: -15, doubleJump: false, dash: true, stomp: false, crusher: false,
        col1: '#FF6B2B', col2: '#FF8C42', col3: '#FF4500',
        abil: ['วิ่งเร็วที่สุด', 'Dash พุ่งผ่านสิ่งกีดขวาง (กด X)'],
        weak: 'กระโดดครั้งเดียว ไม่สูง',
        tip: 'Dash [X] ผ่านหินและทำลายศัตรูได้!'
    },
    rabbit: {
        id: 'rabbit', name: 'กระต่าย', emoji: '🐰',
        speed: 5, jump: -18, doubleJump: true, dash: false, stomp: false, crusher: false,
        col1: '#E8D5C4', col2: '#F5EDE3', col3: '#D4A090',
        abil: ['กระโดดสูงที่สุด', 'กระโดดอีกครั้งกลางอากาศ (↑×2)'],
        weak: 'วิ่งช้า ไม่สามารถโจมตีศัตรู',
        tip: 'กระโดด 2 ครั้งเพื่อเก็บไอเทมบนที่สูง!'
    },
    tiger: {
        id: 'tiger', name: 'เสือ', emoji: '🐯',
        speed: 6, jump: -14.5, doubleJump: false, dash: false, stomp: true, crusher: true,
        col1: '#FFA500', col2: '#FFB833', col3: '#CC7700',
        abil: ['กระทืบศัตรูด้วยการกระโดดลง', 'ทำลายหินขวางทาง'],
        weak: 'กระโดดได้ครั้งเดียว',
        tip: 'กระโดดลงทับหัวศัตรูเพื่อแต้มโบนัส!'
    }
};
const CHAR_KEYS = ['fox', 'rabbit', 'tiger'];

// ─── Game variables ───────────────────────────────────────────────────────────
let ch, score, lives, lvl, dist, ws, gt, inv, combo, hi = 0;
let selIdx = 0;

// World objects
let platforms, obstacles, enemies, items, sparks;

// Player
const P = { x:0, y:0, w:52, h:62, vx:0, vy:0, ground:false, djUsed:false,
            dashing:false, dashT:0, dashCD:0, anim:0, animT:0 };

// ─── Constants ────────────────────────────────────────────────────────────────
const GND  = 430;   // ground y
const GRAV = 0.72;

// ─── Parallax background state ────────────────────────────────────────────────
let bgOff = [0, 0, 0, 0];  // offsets for 4 layers

// ─── Stars ───────────────────────────────────────────────────────────────────
const STARS = Array.from({length:60}, () => ({
    x: Math.random()*W, y: Math.random()*(H*0.65),
    r: Math.random()*1.8+0.4, t: Math.random()*Math.PI*2
}));

// ─── Spawn ────────────────────────────────────────────────────────────────────
let spawnT = 0, spawnI = 110;

function spawnWave() {
    const x = W + 60;
    const r = Math.random();
    if (r < 0.28) {
        // Platform + collectibles
        const py = 190 + Math.random()*120;
        const pw = 70 + Math.random()*80;
        platforms.push({ x, y:py, w:pw, h:14 });
        const nc = 1 + Math.floor(Math.random()*3);
        for (let i=0; i<nc; i++) {
            items.push({ x: x+10+i*25, y:py-32, type:'coin', val:10, a:Math.random()*Math.PI*2 });
        }
        if (Math.random()<0.35) {
            items.push({ x:x+pw/2-12, y:py-70, type:'star', val:50, a:0 });
        }
    } else if (r < 0.58) {
        // Obstacle(s)
        const types = ['rock','spike','cactus'];
        const ot = types[Math.floor(Math.random()*types.length)];
        const oh = ot==='spike'?28:52;
        obstacles.push({ x, y:GND-oh, w:36, h:oh, type:ot });
        if (Math.random()<0.28 && lvl>=2)
            obstacles.push({ x:x+62, y:GND-oh, w:36, h:oh, type:ot });
    } else if (r < 0.8 && lvl>=2) {
        // Enemy
        const et = (lvl>=3 && Math.random()<0.5) ? 'wolf' : 'bat';
        const ey = et==='bat' ? 150+Math.random()*130 : GND-38;
        enemies.push({ x, y:ey, w:42, h:38, vx:-(ws+1+Math.random()*2),
                        type:et, phase:Math.random()*Math.PI*2, dead:false, dyT:0 });
    } else {
        items.push({ x:x+10, y:GND-30, type:'coin', val:5, a:0 });
    }
}

// ─── Reset game ───────────────────────────────────────────────────────────────
function resetGame(cid) {
    ch = CHARS[cid];
    score=0; lives=3; lvl=1; dist=0; ws=3; gt=0; inv=0; combo=0;
    platforms=[]; obstacles=[]; enemies=[]; items=[]; sparks=[];
    spawnT=0; spawnI=110;
    bgOff=[0,0,0,0];
    P.x=110; P.y=GND-P.h; P.vy=0; P.vx=0;
    P.ground=true; P.djUsed=false;
    P.dashing=false; P.dashT=0; P.dashCD=0;
    P.anim=0; P.animT=0;
}

// ─── Input handler ────────────────────────────────────────────────────────────
function onKey(code) {
    if (state===S.MENU) {
        if (code==='Enter'||code==='Space') state=S.SELECT;
    } else if (state===S.SELECT) {
        if (code==='ArrowLeft')  selIdx=(selIdx-1+3)%3;
        if (code==='ArrowRight') selIdx=(selIdx+1)%3;
        if (code==='Enter'||code==='Space') {
            resetGame(CHAR_KEYS[selIdx]);
            state=S.PLAY;
        }
    } else if (state===S.PLAY) {
        if (code==='ArrowUp'||code==='Space'||code==='KeyW') {
            if (P.ground) {
                P.vy=ch.jump; P.ground=false; P.djUsed=false;
                burst(P.x+P.w/2, P.y+P.h, '#88FFAA', 5);
            } else if (ch.doubleJump && !P.djUsed) {
                P.vy=ch.jump*0.88; P.djUsed=true;
                burst(P.x+P.w/2, P.y+P.h/2, '#44AAFF', 8);
            }
        }
        if ((code==='KeyX'||code==='ShiftLeft') && ch.dash && P.dashCD<=0) {
            P.dashing=true; P.dashT=22; P.dashCD=95;
            burst(P.x, P.y+P.h/2, '#FF8844', 8);
        }
    } else if (state===S.OVER||state===S.WIN) {
        if (code==='Enter'||code==='Space') state=S.SELECT;
    }
}

// ─── Particle burst ───────────────────────────────────────────────────────────
function burst(x, y, col, n=6) {
    for (let i=0;i<n;i++) {
        const a = (Math.PI*2/n)*i + Math.random()*0.6;
        const sp= 2+Math.random()*4;
        sparks.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.5,
                       life:35+Math.random()*20, ml:55, col });
    }
}

// ─── Collision ────────────────────────────────────────────────────────────────
function overlap(a, ax,ay,aw,ah, bx,by,bw,bh) {
    return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update() {
    if (state!==S.PLAY) return;
    gt++; dist+=ws;

    // Level up
    const nl = Math.min(6, Math.floor(dist/3500)+1);
    if (nl>lvl) {
        lvl=nl; ws=3+lvl*0.75; spawnI=Math.max(55,110-lvl*9);
        burst(P.x+P.w/2, P.y+P.h/2, '#FFD700', 12);
    }
    if (dist>=22000) { state=S.WIN; hi=Math.max(hi,Math.floor(score)); return; }

    // Player physics
    if (P.dashing) {
        P.vx=16; P.dashT--;
        if (P.dashT<=0){ P.dashing=false; P.vx=0; }
    } else {
        P.vx=0;
    }
    if (P.dashCD>0) P.dashCD--;

    P.vy = Math.min(P.vy+GRAV, 18);
    P.y += P.vy;
    P.x += P.vx;
    P.x = Math.max(50, Math.min(W-P.w-30, P.x));

    // Ground
    if (P.y+P.h >= GND) { P.y=GND-P.h; P.vy=0; P.ground=true; P.djUsed=false; }
    else P.ground=false;

    // Platforms
    for (const pl of platforms) {
        if (P.vy>0 && P.x+P.w>pl.x && P.x<pl.x+pl.w
            && P.y+P.h>pl.y && P.y+P.h<pl.y+pl.h+18) {
            P.y=pl.y-P.h; P.vy=0; P.ground=true; P.djUsed=false;
        }
    }

    if (inv>0) inv--;

    // Score from running
    score += ws*0.04;

    // Obstacles
    for (let i=obstacles.length-1;i>=0;i--) {
        const o=obstacles[i];
        const m=5;
        if (!overlap(null, P.x+m,P.y+m,P.w-m*2,P.h-m*2, o.x+m,o.y+m,o.w-m*2,o.h-m*2)) continue;

        // Dash destroys non-spike
        if (P.dashing && o.type!=='spike') {
            burst(o.x+o.w/2, o.y+o.h/2, '#FF8844', 10);
            score+=25; obstacles.splice(i,1); continue;
        }
        // Tiger crushes rocks
        if (ch.crusher && o.type==='rock') {
            burst(o.x+o.w/2, o.y+o.h/2, '#AAAAAA', 8);
            score+=15; obstacles.splice(i,1); continue;
        }
        if (inv<=0) {
            lives--; inv=110; combo=0;
            burst(P.x+P.w/2, P.y+P.h/2, '#FF4444', 8);
            if (lives<=0){ state=S.OVER; hi=Math.max(hi,Math.floor(score)); }
        }
    }

    // Enemies
    for (let i=enemies.length-1;i>=0;i--) {
        const e=enemies[i];
        if (e.dead) { e.dyT--; if(e.dyT<=0) enemies.splice(i,1); continue; }
        e.x+=e.vx;
        if (e.type==='bat') { e.phase+=0.04; e.y+=Math.sin(e.phase)*1.8; }
        else if (e.type==='wolf') {
            if (e.x < P.x+250) e.vx=Math.min(e.vx-0.05, -(ws+4));
        }
        const m=6;
        if (!overlap(null, P.x+m,P.y+m,P.w-m*2,P.h-m*2, e.x+m,e.y+m,e.w-m*2,e.h-m*2)) continue;

        // Stomp
        if (ch.stomp && P.vy>2 && P.y+P.h < e.y+e.h*0.55+12) {
            e.dead=true; e.dyT=18;
            P.vy=-11;
            score+=30*(combo+1); combo++;
            burst(e.x+e.w/2, e.y+e.h/2, '#FF4400', 10); continue;
        }
        // Dash through
        if (P.dashing) {
            e.dead=true; e.dyT=18; score+=25;
            burst(e.x+e.w/2, e.y+e.h/2, '#FF8844', 8); continue;
        }
        if (inv<=0) {
            lives--; inv=110; combo=0;
            burst(P.x+P.w/2, P.y+P.h/2, '#FF4444', 8);
            if (lives<=0){ state=S.OVER; hi=Math.max(hi,Math.floor(score)); }
        }
    }

    // Items
    for (let i=items.length-1;i>=0;i--) {
        const it=items[i];
        it.a+=0.07;
        const m=4;
        if (!overlap(null, P.x+m,P.y+m,P.w-m*2,P.h-m*2, it.x,it.y+Math.sin(it.a)*5,it.w||20,(it.h||20))) continue;
        score+=it.val*(combo>0?combo+1:1);
        burst(it.x+10, it.y+10, it.type==='star'?'#FFD700':'#FFCC00', 6);
        items.splice(i,1);
    }

    // Spawn
    spawnT++;
    if (spawnT>=spawnI){ spawnT=0; spawnWave(); if(lvl>=3&&Math.random()<0.35) spawnWave(); }

    // Scroll world
    for (const pl of platforms) pl.x-=ws;
    for (const o  of obstacles) o.x-=ws;
    for (const it of items)     it.x-=ws;
    bgOff[0]-=ws*0.15; bgOff[1]-=ws*0.35; bgOff[2]-=ws*0.75; bgOff[3]-=ws*1.1;

    // Cull off-screen
    platforms = platforms.filter(p=>p.x+p.w>-60);
    obstacles = obstacles.filter(o=>o.x+o.w>-60);
    enemies   = enemies.filter(e=>e.x+e.w>-120);
    items     = items.filter(it=>it.x+30>-60);

    // Sparks
    for (let i=sparks.length-1;i>=0;i--) {
        const s=sparks[i];
        s.x+=s.vx; s.y+=s.vy; s.vy+=0.12; s.life--;
        if(s.life<=0) sparks.splice(i,1);
    }

    // Player animation
    P.animT++;
    if(P.animT>7){ P.animT=0; P.anim=(P.anim+1)%4; }
}

// ─── Draw helpers ─────────────────────────────────────────────────────────────
function rr(x,y,w,h,r=6) {
    cx.beginPath(); cx.roundRect(x,y,w,h,r); cx.fill();
}
function circle(x,y,r) {
    cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2); cx.fill();
}
function star5(x,y,r1,r2) {
    cx.beginPath();
    for(let i=0;i<10;i++){
        const a=Math.PI/5*i - Math.PI/2;
        const r=i%2===0?r1:r2;
        if(i===0) cx.moveTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
        else cx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
    }
    cx.closePath(); cx.fill();
}

// ─── Draw background ──────────────────────────────────────────────────────────
function drawBg() {
    // Sky
    const sky=cx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#080e1a'); sky.addColorStop(0.55,'#0f1f3a'); sky.addColorStop(1,'#1a3a12');
    cx.fillStyle=sky; cx.fillRect(0,0,W,H);

    // Stars
    for(const s of STARS){
        s.t+=0.03;
        cx.globalAlpha=0.4+Math.sin(s.t)*0.4;
        cx.fillStyle='#FFF'; circle(s.x,s.y,s.r);
    }
    cx.globalAlpha=1;

    // Moon
    cx.fillStyle='#FFFDE4'; circle(W-90,55,32);
    cx.fillStyle='#0f1f3a'; circle(W-76,49,29);

    // Mountains
    const mBase=GND-5;
    for(let i=0;i<10;i++){
        const mx = ((i*220 + bgOff[0]*0.5)%( W*2.5)) - 150;
        const mh = 80+( (i*73)%90 );
        cx.fillStyle='#152840';
        cx.beginPath(); cx.moveTo(mx-mh*0.75,mBase); cx.lineTo(mx,mBase-mh); cx.lineTo(mx+mh*0.75,mBase); cx.closePath(); cx.fill();
        cx.fillStyle='rgba(255,255,255,0.07)';
        cx.beginPath(); cx.moveTo(mx-mh*0.12,mBase-mh*0.72); cx.lineTo(mx,mBase-mh); cx.lineTo(mx+mh*0.12,mBase-mh*0.72); cx.closePath(); cx.fill();
    }

    // Trees
    for(let i=0;i<18;i++){
        const tx= ((i*130 + bgOff[1]*0.7)%(W*2.8))-100;
        const th= 55+((i*59)%50);
        cx.fillStyle='#2c3d1c';
        cx.fillRect(tx-4, mBase-22, 8, 22);
        cx.fillStyle='#1e3d12';
        cx.beginPath(); cx.moveTo(tx,mBase-22-th); cx.lineTo(tx-th*0.42,mBase-22); cx.lineTo(tx+th*0.42,mBase-22); cx.closePath(); cx.fill();
        cx.beginPath(); cx.moveTo(tx,mBase-22-th*1.25); cx.lineTo(tx-th*0.3,mBase-22-th*0.42); cx.lineTo(tx+th*0.3,mBase-22-th*0.42); cx.closePath(); cx.fill();
    }

    // Ground
    const gr=cx.createLinearGradient(0,GND,0,H);
    gr.addColorStop(0,'#2d5e18'); gr.addColorStop(0.08,'#1c3d0e'); gr.addColorStop(1,'#0c1e07');
    cx.fillStyle=gr; cx.fillRect(0,GND,W,H-GND);
    cx.fillStyle='#3a7a22';
    for(let i=0;i<W;i+=32){
        const gx = (i+(bgOff[3]*0.3))%W;
        cx.fillRect(gx,GND,14,3);
    }

    // Bushes
    for(let i=0;i<22;i++){
        const bx= ((i*95 + bgOff[2])%(W*1.8))-60;
        const bh= 18+((i*37)%18);
        cx.fillStyle='#1e4a10'; circle(bx, GND-bh*0.5, bh*0.65);
        cx.fillStyle='#1a3d0e'; circle(bx+bh*0.4, GND-bh*0.38, bh*0.52);
    }
}

// ─── Draw platform ────────────────────────────────────────────────────────────
function drawPlatform(pl) {
    const grad=cx.createLinearGradient(pl.x,pl.y,pl.x,pl.y+pl.h);
    grad.addColorStop(0,'#5a8c38'); grad.addColorStop(1,'#38571e');
    cx.fillStyle=grad; rr(pl.x,pl.y,pl.w,pl.h,5);
    cx.fillStyle='#7ac44a'; rr(pl.x+2,pl.y,pl.w-4,6,3);
    cx.strokeStyle='#8ecf5a'; cx.lineWidth=1.5;
    cx.beginPath(); cx.roundRect(pl.x,pl.y,pl.w,pl.h,5); cx.stroke();
}

// ─── Draw obstacle ────────────────────────────────────────────────────────────
function drawObstacle(o) {
    if (o.type==='rock') {
        cx.fillStyle='#797979'; circle(o.x+o.w/2, o.y+o.h*0.6, o.w*0.52);
        cx.fillStyle='#9a9a9a'; circle(o.x+o.w*0.3, o.y+o.h*0.38, o.w*0.22);
        cx.fillStyle='#666'; circle(o.x+o.w*0.7, o.y+o.h*0.65, o.w*0.15);
        if (ch&&ch.crusher) {
            cx.strokeStyle='rgba(255,140,0,0.7)'; cx.lineWidth=1.5;
            cx.beginPath(); cx.moveTo(o.x+o.w/2,o.y+8); cx.lineTo(o.x+o.w/2+6,o.y+o.h*0.5);
            cx.lineTo(o.x+o.w/2-4,o.y+o.h*0.85); cx.stroke();
        }
    } else if (o.type==='spike') {
        cx.fillStyle='#888'; cx.fillRect(o.x, o.y+o.h-10, o.w, 10);
        const ns=Math.floor(o.w/12);
        cx.fillStyle='#CCCCCC';
        for(let i=0;i<ns;i++){
            cx.beginPath();
            cx.moveTo(o.x+i*12, o.y+o.h-10);
            cx.lineTo(o.x+i*12+6, o.y);
            cx.lineTo(o.x+i*12+12, o.y+o.h-10);
            cx.closePath(); cx.fill();
        }
    } else { // cactus
        cx.fillStyle='#28822e';
        cx.fillRect(o.x+13,o.y,11,o.h);
        cx.fillRect(o.x+2, o.y+10, 11, 9);
        cx.fillRect(o.x+24,o.y+16, 11, 9);
        cx.fillRect(o.x+2, o.y+2,  9,  10);
        cx.fillRect(o.x+26,o.y+8,  9,  10);
        cx.fillStyle='#1c5e22';
        cx.fillRect(o.x+14,o.y+1,3,o.h-2);
    }
}

// ─── Draw enemy ───────────────────────────────────────────────────────────────
function drawEnemy(e) {
    if (e.dead) {
        cx.globalAlpha=e.dyT/18;
        cx.fillStyle='#FF4444'; circle(e.x+e.w/2, e.y+e.h/2, 16+((18-e.dyT)*1.2));
        cx.globalAlpha=1; return;
    }
    if (e.type==='bat') {
        const wf=Math.sin(gt*0.28)*0.4;
        cx.fillStyle='#3a1050';
        cx.beginPath();
        cx.moveTo(e.x+e.w/2, e.y+e.h/2);
        cx.bezierCurveTo(e.x-10,e.y+wf*30,e.x-28,e.y+18+wf*20, e.x-12,e.y+e.h);
        cx.lineTo(e.x+e.w/2,e.y+e.h/2); cx.fill();
        cx.beginPath();
        cx.moveTo(e.x+e.w/2, e.y+e.h/2);
        cx.bezierCurveTo(e.x+e.w+10,e.y+wf*30,e.x+e.w+28,e.y+18+wf*20, e.x+e.w+12,e.y+e.h);

    } else { // wolf
        cx.fillStyle='#4a4a7a';
        cx.fillRect(e.x+5,e.y+14,30,20);
        cx.fillStyle='#5a5a8c'; circle(e.x+32, e.y+15, 15);
        // Snout
        cx.fillStyle='#7a7a9c';
        cx.beginPath(); cx.ellipse(e.x+43,e.y+18,9,6,0,0,Math.PI*2); cx.fill();
        // Ears
        cx.fillStyle='#4a4a7a';
        cx.beginPath(); cx.moveTo(e.x+22,e.y+7); cx.lineTo(e.x+19,e.y-4); cx.lineTo(e.x+29,e.y+5); cx.closePath(); cx.fill();
        cx.beginPath(); cx.moveTo(e.x+35,e.y+4); cx.lineTo(e.x+42,e.y-4); cx.lineTo(e.x+44,e.y+7); cx.closePath(); cx.fill();
        // Eyes
        cx.fillStyle='#FFAA00'; circle(e.x+36, e.y+13, 4.5);
        cx.fillStyle='#111';    circle(e.x+36, e.y+13, 2.5);
        // Tail
        cx.fillStyle='#5a5a8c'; circle(e.x-6, e.y+20, 10);
        // Legs
        const lf=Math.sin(gt*0.28)*6;
        cx.fillStyle='#4a4a7a';
        cx.fillRect(e.x+8, e.y+32, 9, 10+lf);
        cx.fillRect(e.x+22,e.y+32, 9, 10-lf);
    }
}

// ─── Draw items ───────────────────────────────────────────────────────────────
function drawItem(it) {
    const yo=Math.sin(it.a)*5;
    if (it.type==='coin') {
        cx.fillStyle='#FFD700'; circle(it.x+10, it.y+10+yo, 11);
        cx.fillStyle='#FFA500'; circle(it.x+8,  it.y+8+yo,  5);
        cx.strokeStyle='#FFAA00'; cx.lineWidth=2;
        cx.beginPath(); cx.arc(it.x+10,it.y+10+yo,11,0,Math.PI*2); cx.stroke();
    } else {
        cx.shadowColor='#FFD700'; cx.shadowBlur=14;
        cx.fillStyle='#FFE838'; star5(it.x+12, it.y+12+yo, 14, 7);
        cx.shadowBlur=0;
        cx.strokeStyle='#FFA500'; cx.lineWidth=1.5;
        star5(it.x+12, it.y+12+yo, 14, 7);  // re-stroke
        cx.beginPath();
        for(let i=0;i<10;i++){
            const a=Math.PI/5*i-Math.PI/2;
            const r=i%2===0?14:7;
            if(i===0) cx.moveTo(it.x+12+Math.cos(a)*r, it.y+12+yo+Math.sin(a)*r);
            else       cx.lineTo(it.x+12+Math.cos(a)*r, it.y+12+yo+Math.sin(a)*r);
        }
        cx.closePath(); cx.stroke();
    }
}

// ─── Draw player ─────────────────────────────────────────────────────────────
function drawPlayer() {
    if (!ch) return;
    const { x, y, w, h, anim, ground, dashing, vy } = P;
    const af=anim;

    // Invincibility blink
    if (inv>0 && Math.floor(inv/7)%2===1) { cx.globalAlpha=0.3; }

    // Dash trail
    if (dashing) {
        for(let i=1;i<=3;i++){
            cx.globalAlpha=0.08*(4-i);
            cx.fillStyle=ch.col1;
            cx.fillRect(x-i*13,y,w,h);
        }
        cx.globalAlpha = inv>0 ? 0.3 : 1;
    }

    if      (ch.id==='fox')    drawFox(x,y,w,h,af,ground,dashing,vy);
    else if (ch.id==='rabbit') drawRabbit(x,y,w,h,af,ground,vy);
    else                       drawTiger(x,y,w,h,af,ground,vy);

    cx.globalAlpha=1;
}

function drawFox(x,y,w,h,af,gr,dashing,vy) {
    const lo=gr ? Math.sin(af*Math.PI/2)*9 : 0;
    // Tail
    cx.fillStyle='#FF5500'; circle(x-6,y+h*0.58,16);
    cx.fillStyle='#FFF5E0'; circle(x-9,y+h*0.62,9);
    // Body
    cx.fillStyle='#FF6B2B'; cx.fillRect(x+8,y+h*0.3,w-12,h*0.48);
    cx.fillStyle='#FFF5E0';
    cx.beginPath(); cx.ellipse(x+16,y+h*0.55,9,14,0,0,Math.PI*2); cx.fill();
    // Head
    cx.fillStyle='#FF8C42'; circle(x+w*0.7,y+h*0.28,19);
    // Ears
    cx.fillStyle='#FF6B2B';
    cx.beginPath(); cx.moveTo(x+w*0.42,y+h*0.12); cx.lineTo(x+w*0.36,y-10); cx.lineTo(x+w*0.55,y+h*0.1); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(x+w*0.72,y+h*0.1);  cx.lineTo(x+w*0.84,y-10); cx.lineTo(x+w*0.95,y+h*0.12); cx.closePath(); cx.fill();
    cx.fillStyle='#FFAAAA';
    cx.beginPath(); cx.moveTo(x+w*0.44,y+h*0.1); cx.lineTo(x+w*0.4,y-4); cx.lineTo(x+w*0.52,y+h*0.09); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(x+w*0.74,y+h*0.09); cx.lineTo(x+w*0.84,y-4); cx.lineTo(x+w*0.93,y+h*0.1); cx.closePath(); cx.fill();
    // Eye, nose
    cx.fillStyle='#FFF'; circle(x+w*0.78,y+h*0.24,6);
    cx.fillStyle='#1a1a1a'; circle(x+w*0.8,y+h*0.24,3.5);
    cx.fillStyle='#FF2244'; circle(x+w*0.95,y+h*0.3,3.5);
    // Legs
    cx.fillStyle='#FF5500';
    cx.fillRect(x+10,y+h*0.74,10,14+lo);
    cx.fillRect(x+26,y+h*0.74,10,14-lo);
    // Dash ready dot
    if (P.dashCD<=0) {
        cx.fillStyle='#FFD700'; circle(x+w/2, y-14, 6);
        cx.fillStyle='#FFF'; cx.font='bold 8px Arial'; cx.textAlign='center';
        cx.fillText('X',x+w/2,y-11); cx.textAlign='left';
    }
}

function drawRabbit(x,y,w,h,af,gr,vy) {
    const lo=gr ? Math.sin(af*Math.PI/2)*10 : 0;
    // Long ears
    cx.fillStyle='#E8D5C4';
    cx.beginPath(); cx.ellipse(x+w*0.37,y-10,7,24,-0.15,0,Math.PI*2); cx.fill();

    cx.fillStyle='#FFF'; circle(x+4,y+h*0.65,11);

    cx.fillStyle='#F5EDE3'; circle(x+w*0.52,y+h*0.28,18);

    cx.fillStyle='#E8D5C4';

}

function drawTiger(x,y,w,h,af,gr,vy) {
    const lo=gr ? Math.sin(af*Math.PI/2)*8 : 0;
    // Tail
    cx.fillStyle='#FFA500'; circle(x-5,y+h*0.52,13);
    cx.fillStyle='#7A4000'; circle(x-9,y+h*0.57,7);
    // Body + stripes
    cx.fillStyle='#FFB833'; cx.fillRect(x+5,y+h*0.28,w-6,h*0.48);
    cx.fillStyle='rgba(80,30,0,0.6)';
    cx.fillRect(x+12,y+h*0.3,7,h*0.44); cx.fillRect(x+26,y+h*0.3,7,h*0.44); cx.fillRect(x+40,y+h*0.3,5,h*0.44);
    // Head
    cx.fillStyle='#FFB833'; circle(x+w*0.66,y+h*0.26,21);
    // Face markings
    cx.fillStyle='#FFF5E0';
    cx.beginPath(); cx.ellipse(x+w*0.7,y+h*0.3,13,16,0,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(80,30,0,0.45)';
    cx.beginPath(); cx.moveTo(x+w*0.52,y+h*0.06); cx.lineTo(x+w*0.55,y+h*0.16); cx.lineTo(x+w*0.58,y+h*0.06); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(x+w*0.62,y+h*0.06); cx.lineTo(x+w*0.65,y+h*0.16); cx.lineTo(x+w*0.68,y+h*0.06); cx.closePath(); cx.fill();
    // Ears
    cx.fillStyle='#FFA500';
    cx.beginPath(); cx.moveTo(x+w*0.38,y+h*0.12); cx.lineTo(x+w*0.32,y-6); cx.lineTo(x+w*0.5,y+h*0.1); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(x+w*0.72,y+h*0.1);  cx.lineTo(x+w*0.82,y-6); cx.lineTo(x+w*0.88,y+h*0.12); cx.closePath(); cx.fill();
    // Eyes
    cx.fillStyle='#88FF00'; circle(x+w*0.56,y+h*0.2,6);
    cx.fillStyle='#111';    circle(x+w*0.56,y+h*0.2,3.5);
    // Nose, whiskers
    cx.fillStyle='#FF2244'; circle(x+w*0.86,y+h*0.3,4);
    cx.strokeStyle='#555'; cx.lineWidth=1.5;
    cx.beginPath(); cx.moveTo(x+w*0.86,y+h*0.3); cx.lineTo(x+w+6,y+h*0.26); cx.stroke();
    cx.beginPath(); cx.moveTo(x+w*0.86,y+h*0.32); cx.lineTo(x+w+6,y+h*0.36); cx.stroke();
    // Legs
    cx.fillStyle='#FFA500';
    cx.fillRect(x+10,y+h*0.74,13,14+lo); cx.fillRect(x+28,y+h*0.74,13,14-lo);
    // Stomp aura when falling fast
    if (!gr && vy>6) {
        cx.strokeStyle='rgba(255,68,0,0.6)'; cx.lineWidth=3;
        cx.beginPath(); cx.arc(x+w/2,y+h/2, 28+vy*0.8,0,Math.PI*2); cx.stroke();
    }
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD() {
    // Score
    cx.fillStyle='rgba(0,0,0,0.45)'; rr(10,10,195,38,8);
    cx.fillStyle='#FFD700'; cx.font='bold 21px Arial';
    cx.fillText(`Score: ${Math.floor(score)}`,20,33);

    // Level
    cx.fillStyle='rgba(0,0,0,0.45)'; rr(214,10,110,38,8);
    cx.fillStyle='#88FF88'; cx.font='bold 21px Arial';
    cx.fillText(`Lv.${lvl}`,225,33);

    // Lives
    cx.fillStyle='rgba(0,0,0,0.45)'; rr(333,10,110,38,8);
    for(let i=0;i<3;i++){
        cx.fillStyle = i<lives ? '#FF4444' : '#444';
        cx.font='22px Arial'; cx.fillText('♥',345+i*34,33);
    }

    // Character
    cx.fillStyle='rgba(0,0,0,0.45)'; rr(W-220,10,210,38,8);
    cx.fillStyle='#FFF'; cx.font='15px Arial';
    if (ch) cx.fillText(`${ch.emoji} ${ch.name}`,W-210,33);

    // Tip bar
    if (ch) {
        cx.fillStyle='rgba(0,0,0,0.35)'; rr(10,52,380,26,6);
        cx.fillStyle='#FFDD88'; cx.font='12px Arial';
        cx.fillText(ch.tip,16,68);
    }

    // Progress
    const prog = Math.min(dist/22000,1);
    cx.fillStyle='rgba(0,0,0,0.4)'; rr(10,H-30,W-20,18,6);
    const pgr=cx.createLinearGradient(10,0,W-10,0);
    pgr.addColorStop(0,'#22aa44'); pgr.addColorStop(1,'#aaff44');
    cx.fillStyle=pgr; rr(10,H-30,(W-20)*prog,18,6);
    cx.fillStyle='rgba(255,255,255,0.6)'; cx.font='11px Arial'; cx.textAlign='center';
    cx.fillText(`${Math.floor(prog*100)}%  [${Math.floor(dist)}m / 22000m]`,W/2,H-17);
    cx.textAlign='left';

    // Combo
    if (combo>=2) {
        cx.fillStyle=`rgba(255,${Math.max(0,255-combo*25)},0,0.92)`;
        cx.font=`bold ${20+combo*4}px Arial`; cx.textAlign='center';
        cx.fillText(`COMBO ×${combo}!`,W/2,80); cx.textAlign='left';
    }

    // Level up flash
    const lvlFlash = dist % 3500;
    if (lvlFlash < ws*60 && dist>100) {
        const alpha = Math.min(1,(ws*60-lvlFlash)/(ws*60))*0.9;
        cx.fillStyle=`rgba(0,0,0,${alpha*0.6})`; rr(W/2-140,H/2-38,280,66,14);
        cx.fillStyle=`rgba(255,215,0,${alpha})`;
        cx.font='bold 32px Arial'; cx.textAlign='center';
        cx.fillText(`⭐ LEVEL ${lvl}! ⭐`,W/2,H/2+10); cx.textAlign='left';
    }
}

// ─── Sparks draw ──────────────────────────────────────────────────────────────
function drawSparks() {
    for(const s of sparks){
        cx.globalAlpha=s.life/s.ml;
        cx.fillStyle=s.col; circle(s.x,s.y, 3*(s.life/s.ml)+1);
    }
    cx.globalAlpha=1;
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop() {
    gt++;
    update();
    cx.clearRect(0,0,W,H);

    if (state===S.MENU) {
        drawMenu();
    } else if (state===S.SELECT) {
        drawSelect();
    } else if (state===S.PLAY||state===S.OVER) {
        drawBg();
        for(const pl of platforms) drawPlatform(pl);
        for(const o  of obstacles) drawObstacle(o);
        for(const e  of enemies)   drawEnemy(e);
        for(const it of items)     drawItem(it);
        drawPlayer();
        drawSparks();
        drawHUD();
        if (state===S.OVER) drawOver();
    } else if (state===S.WIN) {
        drawBg();
        drawHUD();
        drawWin();
    }

    requestAnimationFrame(loop);
}

loop();
</script>
